version: "v0.4"

project:
  name: "Cutoff phenomenon for fast diffusion and porous medium equations"
  description: >-
    Formalization of the paper "On the cutoff phenomenon for fast diffusion and porous medium
    equations" by D. Chafaï, M. Fathi and N. Simonov. For the Fokker–Planck version of the fast
    diffusion / porous medium equation in ℝᵈ started from a Dirac mass, whose solution is an
    explicit rescaled Barenblatt profile, the quadratic Wasserstein distance, the Tsallis-type
    relative entropy and the Fisher information to equilibrium, maximized over initial points in
    a ball of radius r√d, exhibit a cutoff phenomenon as d → ∞: they jump from +∞ to 0 at the
    critical time max(1,α)/2 · log d for a fixed self-similarity exponent α ≠ 1/2, and at
    1/2 · log d for a fixed exponent m > 1. The formalization also covers the Wasserstein
    distance between a measure and its image under an affine map with positive semidefinite
    linear part, the exact Gamma-function formulas for the moments and Lᵐ norms of the
    full-space and compactly supported Barenblatt profiles and their high-dimensional
    asymptotics, the normalization of the Barenblatt profile, and the fact that the explicit
    solution solves the equation.
  authors:
    - "Djalil Chafaï"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Djalil Chafaï"

classification:
  arxiv: ["math.AP", "math.PR"]
  msc2020: ["35K55", "35B40", "49Q22", "60J60"]

