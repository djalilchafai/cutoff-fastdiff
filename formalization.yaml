related_formalizations: []

status:
  scope: >-
    All mathematical statements of the paper are formalized and proved in Challenge.lean (49
    theorems): Theorems 1.1 and 1.2 for W₂², Hₘ and Iₘ; Lemmas 2.1, 2.2, 3.1, 4.1, 4.2; the
    normalization of the Barenblatt profile; the solutions u of ∂ₜu = Δ(uᵐ) and v of the
    Fokker–Planck version, which solve their equations, are probability densities, tend to δ_{x₀}
    as t → 0⁺, are linked by the time change (uv)/(FDEFPv), and v(t) → v_∞ as t → ∞; the moment
    condition m > d/(d+2) and W₂² = ∞ for heavier tails; the entropy dissipation identity
    dHₘ/dt = -Iₘ and the Bregman form (tsalisbis) of Hₘ with Hₘ ≥ 0; the diffusion limit m → 1
    (Gaussian, heat kernel, Mehler formula); the cutoff for initial points in balls of radius
    r·d^θ (Section 1.4.3); Remark 3.2 (Student t-distributions: stochastic representation,
    moments, Gaussian limit, Fisher–Snedecor law, Barenblatt profiles as Student densities,
    σ_d² → 2πe) and Remark 4.3 (projections and stereographic projection of the uniform law on
    spheres, Gaussian representation). Not formalized: uniqueness of solutions of the PDE with
    Dirac data (the solution is the explicit formula, as in the paper), Demange's spherical
    profile (Section 1.4.5, needs the Laplace–Beltrami operator) and purely qualitative comments.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

