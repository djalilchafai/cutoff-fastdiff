        `lake env lean` against fixed sorry-stubbed interfaces; the statement file was written
        first and audited separately.
      cost:
        wall_time: "about 3.5 hours of wall-clock time, in two phases of 8 and 7 parallel sub-agents"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        The human asked to fully formalize the paper following Palomar standards; the agent
        designed the Challenge statements, a module blueprint, and briefs for sub-agents.
  spend_usd: "subscription-based"
  notes: >-
    The orchestrating agent wrote Challenge.lean, a module blueprint with fixed sorry-stubbed
    interfaces, and briefs; sub-agents proved the modules in parallel; the orchestrator
    integrated, built, checked axioms and ran lake comparator. Human review of the statements
    is pending.

fidelity:
  divergences: >-
    (1) In Theorems 1.1 and 1.2 the "+∞" case is stated for 0 < ε < 1 (for ε ≥ 1 the time
    (1-ε)c log d is not positive). (2) W₂² and Iₘ take values in [0,∞]; Hₘ is a Bochner integral,
    so its integrability is stated explicitly, and its supremum is taken in EReal. (3) The
    second moment in Lemma 2.1 appears as ∫|(A-I)x|² dμ, which equals Tr((A-I)² M_μ); the
    covariance form of the lemma is not stated separately. (4) Lemma 2.2 assumes both
    covariance matrices positive definite (the paper says positive semidefinite, but its proof
    inverts Σ_μ). (4b) The errors of the remarks listed in ERRATA.md (items 8–14) are corrected
    in the Lean statements: projected spherical constant, Fisher–Snedecor normalization, Gaussian
    limit 𝒩(x₀,Σ), stereographic density, and the m → 1 limit of the Tsallis function stated as
    (xᵐ - x)/(m - 1) → x log x. (5) In eq. (Bac) the paper's range "a > d-2p" is corrected to -d < a < 2p-d;
    eq. (CBac) is proved for all a > -d; eq. (Bmpme) is stated for m > 0 (the paper's m = 0
    would need the convention 0⁰ = 0). (6) In Lemmas 3.1 and 4.1 the O(1) differences are in
    fact eventually exactly 0 (virial identity), which is what is proved. (7) The distances are
    those of the paper; the Fisher information uses Mathlib's gradient, which is irrelevant on
    {v = 0} because the integrand carries the factor v.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Statements were written and audited by the orchestrating agent against the paper (including
    a numerical check of the PDE identity); a human audit by the paper's author is pending.

